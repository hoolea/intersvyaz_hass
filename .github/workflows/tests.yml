name: Test relay buttons

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Home Assistant
        run: python -m pip install homeassistant==2026.10.0
      - name: Run tests without real API requests
        run: python -W error::RuntimeWarning -m unittest discover -s tests -v
