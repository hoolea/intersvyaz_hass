open_door:
  name: Открыть дверь
  description: >-
    Открывает дверь домофона. Без relay_id открывается первое реле первого
    адреса (как в прошлых версиях). Чтобы открыть конкретный вход или калитку,
    укажите relay_id — он есть в атрибутах кнопки «Открыть: …».
  fields:
    relay_id:
      name: ID реле
      description: Идентификатор реле (атрибут relay_id кнопки).
      required: false
      example: "12345"
      selector:
        text:
